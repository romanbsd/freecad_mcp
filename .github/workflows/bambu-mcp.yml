name: Bambu MCP

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'tools/bambu-mcp/**'
      - 'print_pipeline_core/**'
      - 'slicer_pipeline.py'
      - 'orientation_candidates.py'
      - 'tools/benchmark_print_tools.py'
      - 'tools/benchmark_print_validation.py'
      - 'tools/benchmarks/**'
      - 'src/freecad_bridge.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'printability.py'
      - 'manufacturing_export.py'
      - 'parametric.py'
      - 'tests/test_*.py'
      - '.github/workflows/bambu-mcp.yml'
  pull_request:
    paths:
      - 'tools/bambu-mcp/**'
      - 'print_pipeline_core/**'
      - 'slicer_pipeline.py'
      - 'orientation_candidates.py'
      - 'tools/benchmark_print_tools.py'
      - 'tools/benchmark_print_validation.py'
      - 'tools/benchmarks/**'
      - 'src/freecad_bridge.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'printability.py'
      - 'manufacturing_export.py'
      - 'parametric.py'
      - 'tests/test_*.py'
      - '.github/workflows/bambu-mcp.yml'
  workflow_dispatch:

jobs:
  unit-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra validation --python '${{ matrix.python }}'
      - name: Standalone unit and schema checks
        run: uv run --locked --extra validation python -m pytest tools/bambu-mcp/tests -m 'not slow'
        env:
          PRINT_VALIDATION_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Bridge, shared pipeline and protocol contracts
        env:
          FREECAD_BAMBU_BACKEND_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          uv run --locked --extra validation python -m pytest
          tests/test_slicer_pipeline.py tests/test_unified_print_pipeline.py
          tests/test_orientation_candidates.py tests/test_print_workflow_bridge.py
          tests/test_bridge.py tests/test_bridge_mcp.py tests/test_framing.py
          tests/test_parametric_logic.py tests/test_printability.py tests/test_manufacturing_export.py
