name: Bambu MCP

on:
  push:
    paths:
      - 'tools/bambu-mcp/**'
      - '.github/workflows/bambu-mcp.yml'
  pull_request:
    paths:
      - 'tools/bambu-mcp/**'
      - '.github/workflows/bambu-mcp.yml'
  workflow_dispatch:

jobs:
  unit-and-schema:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: tools/bambu-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -m 'not slow'
