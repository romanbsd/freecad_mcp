[project]
name = "freecad-mcp"
version = "0.1.0"
description = "FreeCAD bridge and measured printing workflow through FastMCP"
authors = [{name = "FreeCAD MCP Contributors"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["fastmcp>=4.1,<5", "bambu-mcp"]

[project.optional-dependencies]
validation = ["bambu-mcp[validation]"]

[dependency-groups]
dev = ["pytest>=7.4", "black>=23.7", "isort>=5.12", "mypy>=1.5"]

[project.urls]
Homepage = "https://github.com/bonninr/freecad_mcp"
"Bug Tracker" = "https://github.com/bonninr/freecad_mcp/issues"

# The desktop addon and bridge are run from this source checkout.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/bambu-mcp"]

[tool.uv.sources]
bambu-mcp = {workspace = true}
